# Builds the Windows installer, macOS disk images and the theme-naming model pack,
# then attaches them to a GitHub Release. Free for public repositories.
# Trigger: push a tag like v0.2.0, or run manually from the Actions tab.
name: Build release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.12"
  NAMING_MODEL: "llama3.1:8b"
  # Verify this URL before release; the Llama 3.1 license must ship with the model.
  NAMING_LICENSE_URL: "https://raw.githubusercontent.com/meta-llama/llama-models/main/models/llama3_1/LICENSE"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ env.PYTHON_VERSION }}" }
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libgl1
      - run: pip install -e ".[test]"
      - run: QT_QPA_PLATFORM=offscreen python -m pytest -q

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ env.PYTHON_VERSION }}" }
      - name: Install build dependencies (CPU-only PyTorch keeps the installer small)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[analysis,build]"
      - run: python scripts/fetch_resources.py
      - run: pyinstaller packaging/doc_topic_model_tool.spec --noconfirm
      - name: Build installer
        run: |
          choco install innosetup -y --no-progress
          $version = "${{ github.ref_name }}".TrimStart("v")
          if (-not $version -or $version -eq "main") { $version = "0.0.0-dev" }
          iscc "/DAppVersion=$version" packaging\windows\installer.iss
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: "dist/*.exe" }

  macos:
    needs: test
    strategy:
      matrix:
        include:
          - { runner: macos-14, arch: arm64 }
          # macos-13 was retired in Dec 2025; macos-15-intel is the last Intel image (until ~Aug 2027).
          - { runner: macos-15-intel, arch: x86_64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ env.PYTHON_VERSION }}" }
      - run: pip install -e ".[analysis,build]"
      - run: python scripts/fetch_resources.py
      - run: pyinstaller packaging/doc_topic_model_tool.spec --noconfirm
      - name: Build disk image (ad-hoc signed)
        run: |
          version="${GITHUB_REF_NAME#v}"
          [ "$version" = "main" ] && version="0.0.0-dev"
          packaging/macos/build_dmg.sh "$version" "${{ matrix.arch }}"
      - uses: actions/upload-artifact@v4
        with: { name: "macos-${{ matrix.arch }}", path: "dist/*.dmg" }

  model-pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ env.PYTHON_VERSION }}" }
      # llama3.1:8b needs ~10 GB while building (model store + pack); make room.
      - name: Free runner disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h .
      # The model files are the same on every OS, so one pack serves Windows and Mac.
      - run: python scripts/fetch_resources.py --skip-model
      - run: curl -fsSL "$NAMING_LICENSE_URL" -o llama-license.txt
      - run: >
          python scripts/build_model_pack.py --model "${{ env.NAMING_MODEL }}"
          --license "Llama 3.1 Community License" --license-file llama-license.txt
      - uses: actions/upload-artifact@v4
        with:
          name: model-pack
          path: |
            dist/*.tmtpack
            dist/*.tmtpack.[0-9][0-9][0-9]
            dist/*-LICENSE.txt

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos, model-pack]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: artifacts, merge-multiple: true }
      - name: Refuse files GitHub would reject (2 GiB per file)
        run: |
          too_big=$(find artifacts -type f -size +2097151k)
          if [ -n "$too_big" ]; then echo "Over 2 GiB: $too_big"; exit 1; fi
      - name: Checksums
        run: cd artifacts && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Publish release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/* \
            --title "Topic Model Tool $GITHUB_REF_NAME" \
            --notes-file docs/RELEASE_NOTES_TEMPLATE.md
